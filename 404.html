<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Club Pádel Sabor</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M14 40 L32 12 L50 40 Z' fill='none' stroke='%23a3e635' stroke-width='4'/%3E%3Ccircle cx='32' cy='44' r='5' fill='%2338bdf8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-slate-900 text-slate-100 antialiased">
  <main class="relative flex min-h-[100svh] flex-col items-center justify-center overflow-hidden px-4 py-16 text-center">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_center,_rgba(163,230,53,0.12),_transparent_55%),radial-gradient(ellipse_at_80%_20%,_rgba(56,189,248,0.12),_transparent_40%)]"></div>

    <div class="relative z-10 max-w-lg">
      <div class="mx-auto mb-8 flex h-24 w-24 items-center justify-center rounded-3xl bg-slate-800 ring-1 ring-lime-400/40">
        <svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M10 46 L32 10 L54 46 Z" fill="none" stroke="#a3e635" stroke-width="4" />
          <circle cx="32" cy="50" r="6" fill="#38bdf8" />
          <path d="M22 34h20" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" />
        </svg>
      </div>

      <p class="font-display text-7xl font-extrabold tracking-tight text-slate-700">404</p>
      <h1 class="font-display mt-4 text-3xl font-bold text-white sm:text-4xl" data-i18n="error404.title">
        ¡Te has salido de la pista!
      </h1>
      <p class="mt-4 text-slate-400" data-i18n="error404.text">
        Esta página no existe. Vuelve al club y sigue disfrutando.
      </p>

      <div class="mt-6 flex justify-center gap-1 rounded-lg bg-slate-800/80 p-1 ring-1 ring-slate-700/80">
        <button type="button" class="lang-btn rounded-md px-3 py-1.5 text-xs font-bold text-slate-400" data-lang="es">ES</button>
        <button type="button" class="lang-btn rounded-md px-3 py-1.5 text-xs font-bold text-slate-400" data-lang="ca">CA</button>
        <button type="button" class="lang-btn rounded-md px-3 py-1.5 text-xs font-bold text-slate-400" data-lang="en">EN</button>
        <button type="button" class="lang-btn rounded-md px-3 py-1.5 text-xs font-bold text-slate-400" data-lang="de">DE</button>
      </div>

      <a href="/" class="btn-primary mt-8 inline-flex rounded-2xl px-6 py-3 text-sm" data-i18n="error404.cta">Volver al inicio</a>
    </div>
  </main>

  <script src="/js/i18n.js" defer></script>
  <script src="/js/main.js" defer></script>
</body>
</html>
